<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <meta
      name="description"
      content="双截龙 · 重生 — 浏览器里的 FC 清版动作游戏。复刻 Technos Japan 1988 版：纵深走位、抓投、缴械、7 级升级解锁招式。TypeScript + Canvas 2D，零二进制资源。"
    />
    <title>双截龙 · 重生 / Double Dragon Reborn</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Cpath d='M8 10h4v5h8v-5h4v12h-4v-4h-8v4H8z' fill='%23e8413a'/%3E%3Cpath d='M13 17h6v3h-6z' fill='%23ffd24a'/%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #0a0908;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; }
      canvas {
        display: block; touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 2px #1c1917, 0 18px 60px rgba(0, 0, 0, .8);
      }
      body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #a8a29e; font-size: 13px; letter-spacing: .12em; background: #0a0908;
        z-index: 10; text-align: center; line-height: 2;
      }
      #boot kbd {
        display: inline-block; min-width: 1.7em; padding: 2px 6px; margin: 0 2px;
        border: 1px solid #44403c; border-bottom-width: 2px; border-radius: 4px;
        background: #1c1917; color: #e7e5e4; font: inherit; font-size: 12px;
      }
      #boot small { color: #57534e; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="screen" width="256" height="240"></canvas></div>
    <div id="boot">
      <div>
        <div style="color:#e8413a;font-size:18px;letter-spacing:.3em;margin-bottom:14px">双截龙 · 重生</div>
        按 <kbd>ENTER</kbd> 开始
        <br />
        <small>WASD 移动 · J 拳 · K 脚 · L 跳 · Q 奥义</small>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
